[project]
name = "chess-agent"
version = "0.1.0"
requires-python = ">= 3.13"
dependencies = [
    "langchain",
    "langgraph",
    "langchain-anthropic",
    "python-chess",
    "streamlit",
    "python-dotenv",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
chess-agent = { path = ".", editable = true }
